services:
  # Go API. Not exposed to the host: nginx reaches it over the compose network
  # by service name. Kept out of the public ports so the browser uses one origin.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
    expose:
      - "8080"

  # nginx serving the built frontend and proxying /api to backend.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
