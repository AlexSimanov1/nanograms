# nginx config for the frontend compose service.
# Serves the built SPA from this container and proxies /api and /health to the
# backend service (resolved by name over the compose network), so the browser
# talks to a single origin and no CORS setup is needed.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API -> Go backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8080;
    }

    # Static assets and SPA fallback (hash-based routing lives in the browser)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
